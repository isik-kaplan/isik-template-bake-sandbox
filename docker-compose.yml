services:
  database:
    build:
      context: ./database
    image: ${COMPOSE_PROJECT_NAME:-test-project}-database:latest
    # Its own credentials, not all of .env: each service holds only the secrets it needs.
    environment:
      POSTGRES_DB: ${TEST_PROJECT__DB__NAME}
      POSTGRES_USER: ${TEST_PROJECT__DB__USER}
      POSTGRES_PASSWORD: ${TEST_PROJECT__DB__PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TEST_PROJECT__DB__USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  broker:
    build:
      context: ./broker
    image: ${COMPOSE_PROJECT_NAME:-test-project}-broker:latest
    environment:
      RABBITMQ_DEFAULT_USER: ${TEST_PROJECT__BROKER__USER}
      RABBITMQ_DEFAULT_PASS: ${TEST_PROJECT__BROKER__PASSWORD}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Rate-limit counts and the cache: nothing in it needs to survive a restart, so no persistence.
  cache:
    image: redis:8.8-alpine
    command:
      - redis-server
      - --requirepass
      - ${TEST_PROJECT__CACHE__PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      # For the healthcheck's redis-cli; the server takes --requirepass.
      REDISCLI_AUTH: ${TEST_PROJECT__CACHE__PASSWORD}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object storage: Garage, one node, in dev, tests and production alike.
  storage:
    build:
      context: ./storage
    image: ${COMPOSE_PROJECT_NAME:-test-project}-storage:latest
    environment:
      # The entrypoint ensures this key and bucket on every start; the app never creates one.
      BUCKET_NAME: ${TEST_PROJECT__STORAGE__BUCKET_NAME}
      REGION_NAME: ${TEST_PROJECT__STORAGE__REGION_NAME}
      ACCESS_KEY_ID: ${TEST_PROJECT__STORAGE__ACCESS_KEY_ID}
      SECRET_ACCESS_KEY: ${TEST_PROJECT__STORAGE__SECRET_ACCESS_KEY}
      RPC_SECRET: ${TEST_PROJECT__STORAGE__RPC_SECRET}
      KEY_CAN_CREATE_BUCKETS: ${TEST_PROJECT__STORAGE__KEY_CAN_CREATE_BUCKETS}
    volumes:
      - storage_data:/var/lib/garage
    networks:
      - internal
      # Docker publishes no ports for a container on internal networks only.
      - external
    ports:
      # Loopback only, for inspecting by hand.
      - "127.0.0.1:${TEST_PROJECT__STORAGE__PORT:-3900}:3900"
    restart: unless-stopped
    healthcheck:
      # Ready only once the key and bucket exist, so the backend never starts before them.
      test: ["CMD-SHELL", "test -f /tmp/ready && garage status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./test_project
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-test-project}-backend:latest
    env_file: .env
    volumes:
      - ./test_project:/test_project
    networks:
      internal:
        # nginx targets this, not "backend": on two networks the bare name may resolve to either one.
        aliases:
          - backend-internal
      external:
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ${COMPOSE_PROJECT_NAME:-test-project}-backend:latest
    command: celery -A test_project worker
    env_file: .env
    volumes:
      - ./test_project:/test_project
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: ${COMPOSE_PROJECT_NAME:-test-project}-backend:latest
    command: celery -A test_project beat --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - ./test_project:/test_project
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # The frontend suites, as CI runs them: `docker compose run --rm frontend-test`.
  frontend-test:
    build:
      context: ./test_project-frontend
      dockerfile: apps/web/Dockerfile
      target: tester
    image: ${COMPOSE_PROJECT_NAME:-test-project}-frontend-test:latest
    profiles: ["test"]
    working_dir: /repo
    volumes:
      # Live sources, but the image's own node_modules, which are built for its platform.
      - ./test_project-frontend:/repo
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/api/node_modules
      - /repo/packages/auth-api/node_modules

  frontend:
    build:
      context: ./test_project-frontend
      dockerfile: apps/web/Dockerfile
      args:
        # The one build-time value: next build inlines it into the client bundle.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: ${COMPOSE_PROJECT_NAME:-test-project}-frontend:latest
    # Named one by one: none of the backend's secrets belong in the public-facing process.
    environment:
      TEST_PROJECT__DOMAIN: ${TEST_PROJECT__DOMAIN}
      TEST_PROJECT__OAUTH_PROVIDER__MODE: ${TEST_PROJECT__OAUTH_PROVIDER__MODE:-off}
      TEST_PROJECT__SOCIAL_LOGIN__PROVIDERS: ${TEST_PROJECT__SOCIAL_LOGIN__PROVIDERS:-}
      TEST_PROJECT__SOCIAL_LOGIN__ICONS: ${TEST_PROJECT__SOCIAL_LOGIN__ICONS:-}
      TEST_PROJECT_SERVER__SENTRY__DSN: ${TEST_PROJECT_SERVER__SENTRY__DSN:-}
      # A secret, so under the server-only prefix.
      TEST_PROJECT_SERVER__FRONTEND_KEY: ${TEST_PROJECT__FRONTEND_KEY:-}
      # Written by scripts/dev-tls.sh.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Must outlast nginx's upstream keepalive_timeout, or nginx reuses connections Node already closed.
      KEEP_ALIVE_TIMEOUT: 65000
    networks:
      internal:
        aliases:
          - frontend-internal
      external:
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Not "/": that renders the root layout, which calls the backend.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/manifest.webmanifest"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The only service publishing a host port.
  server:
    build:
      context: ./test_project-server
    image: ${COMPOSE_PROJECT_NAME:-test-project}-server:latest
    # entrypoint.sh renders the nginx template with every variable here.
    environment:
      TEST_PROJECT__DOMAIN: ${TEST_PROJECT__DOMAIN}
      TEST_PROJECT__FRONTEND_KEY: ${TEST_PROJECT__FRONTEND_KEY:-}
      TEST_PROJECT__TRUSTED_PROXY_COUNT: ${TEST_PROJECT__TRUSTED_PROXY_COUNT:-2}
      TEST_PROJECT__RATE_LIMITS__ENABLED: ${TEST_PROJECT__RATE_LIMITS__ENABLED:-true}
      TEST_PROJECT__RATE_LIMITS__REQUESTS_PER_SECOND: ${TEST_PROJECT__RATE_LIMITS__REQUESTS_PER_SECOND:-20}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${TEST_PROJECT__HTTP_BIND:-127.0.0.1}:${TEST_PROJECT__HTTP_PORT:-80}:80"
    networks:
      internal:
        # So the frontend's server-side fetches go through nginx like a browser's, not straight to the backend.
        aliases:
          - api.${TEST_PROJECT__DOMAIN}
          - admin.${TEST_PROJECT__DOMAIN}
          - auth.${TEST_PROJECT__DOMAIN}
      # Docker publishes no ports for a container on internal networks only.
      external:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  storage_data:

networks:
  internal:
    internal: true
  external:
    driver: bridge
